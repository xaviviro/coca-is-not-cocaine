[project]
name = "coca-is-not-cocaine"
version = "1.1.0"
description = "Cultural bias probing of open-weight LLMs on Catalan concepts via contextualized hidden-state embeddings."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Xavier Vinaixa Roselló", email = "xavi@sorensen.ai" },
]
dependencies = [
    "accelerate>=1.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "sentencepiece>=0.2",
    "tabulate>=0.10.0",
    "torch>=2.4",
    "transformers>=4.56",
    "umap-learn>=0.5.6",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.43"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coca"]
